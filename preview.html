<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agendamento Online</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root {
  --bg: #14110f;
  --card: #1f1a17;
  --card-2: #28211d;
  --line: #3a312b;
  --text: #f3ece4;
  --muted: #a89a8c;
  --accent: #c8a15a;
  --accent-ink: #1a1308;
  --danger: #e0705f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; }

.app {
  display: flex; flex-direction: column;
  min-height: 100%;
  max-width: 560px; margin: 0 auto;
}

/* Cabeçalho */
.top {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; border-bottom: 1px solid var(--line);
}
.avatar {
  width: 42px; height: 42px; flex: none; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--accent); color: var(--accent-ink); font-weight: 700; letter-spacing: .03em;
}
.who { min-width: 0; flex: 1; display: flex; flex-direction: column; line-height: 1.25; }
.who strong { font-size: 1.05rem; color: var(--accent); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who small { color: var(--muted); font-size: .8rem; }

.owner-link {
  flex: none; padding: 7px 12px; border-radius: 10px; font-size: .82rem; font-weight: 600; text-align: center;
  color: var(--text); text-decoration: none; border: 1px solid var(--line); background: var(--card);
}
.owner-link:hover { border-color: var(--accent); }
.owner-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (max-width: 380px) { .owner-link { max-width: 7.5em; line-height: 1.2; } }

/* Etapas */
.progress { padding: 12px 16px 0; }
.progress-label { margin: 0 0 8px; font-size: .8rem; color: var(--muted); letter-spacing: .02em; }
.bars { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.bars span { height: 4px; border-radius: 2px; background: var(--line); }
.bars span.on { background: var(--accent); }

.stage { flex: 1; padding: 20px 16px 16px; display: flex; flex-direction: column; gap: 16px; }
.stage h2 { margin: 0; font-size: 1.2rem; text-wrap: balance; }
.muted { color: var(--muted); margin: 0; font-size: .9rem; }
.err { color: var(--danger); margin: 0; font-size: .9rem; }

/* Campos */
.field { display: grid; gap: 6px; font-size: .9rem; color: var(--muted); }
.field input {
  width: 100%; padding: 13px 12px; font: inherit; font-size: 1rem;
  background: var(--card); color: var(--text);
  border: 1px solid var(--line); border-radius: 10px;
}
.field .hint { min-height: 1.1em; color: var(--danger); font-size: .8rem; }
.opt-tag { font-weight: 400; color: var(--muted); }

/* Barbeiros */
.picks { display: grid; gap: 10px; }
.pick {
  display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
  padding: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px;
}
.pick:hover { border-color: var(--accent); }
.pick[aria-checked="true"] { border-color: var(--accent); background: var(--card-2); box-shadow: inset 0 0 0 1px var(--accent); }
.initials {
  width: 46px; height: 46px; flex: none; border-radius: 50%;
  display: grid; place-items: center; font-weight: 700;
  background: var(--bg); border: 1px solid var(--line); color: var(--accent);
}
.pick-name { font-weight: 600; }

/* Serviços */
.svc-list { display: grid; gap: 8px; }
.svc {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px;
  padding: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; cursor: pointer;
}
.svc:has(input:checked) { border-color: var(--accent); background: var(--card-2); }
.svc input { width: 20px; height: 20px; accent-color: var(--accent); }
.svc .meta { min-width: 0; display: flex; flex-direction: column; }
.svc .meta b { font-weight: 600; overflow-wrap: anywhere; }
.svc .meta small { color: var(--muted); }
.svc .price { font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.svc-total {
  position: sticky; bottom: 0; margin: 0;
  padding: 10px 12px; border-radius: 10px; background: var(--card-2); border: 1px solid var(--line);
  font-size: .9rem; color: var(--muted);
}
.svc-total b { color: var(--accent); }

/* Calendário */
.cal { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 8px; }
.cal-head { display: flex; align-items: center; justify-content: space-between; }
.cal-head button {
  width: 40px; height: 40px; font-size: 1.4rem; line-height: 1;
  background: transparent; border: 1px solid var(--line); border-radius: 10px;
}
.cal-head button:hover:not(:disabled) { border-color: var(--accent); }
.cal-head button:disabled { opacity: .3; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.weekdays span { text-align: center; font-size: .75rem; color: var(--muted); padding: 2px 0; }
.day {
  aspect-ratio: 1; padding: 0; border-radius: 10px;
  background: transparent; border: 1px solid var(--line); font-variant-numeric: tabular-nums;
}
.day:hover:not(:disabled) { border-color: var(--accent); }
.day:disabled { opacity: .25; border-color: transparent; }
.day.selected { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }

.times-title { margin: 0; font-size: 1rem; }
.times { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.time {
  padding: 12px 0; border-radius: 10px; font-weight: 600; font-variant-numeric: tabular-nums;
  background: var(--card); border: 1px solid var(--line);
}
.time:hover { border-color: var(--accent); }
.time.selected { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

/* Resumo */
.review { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 4px 14px; }
.row { display: flex; justify-content: space-between; gap: 16px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row dt { color: var(--muted); flex: none; }
.row dd { margin: 0; text-align: right; min-width: 0; overflow-wrap: anywhere; }
.row.total dd { color: var(--accent); font-weight: 700; font-size: 1.1rem; }
.note { margin: 0; font-size: .85rem; color: var(--muted); }

/* Confirmação final */
.done { text-align: center; display: grid; justify-items: center; gap: 12px; padding-top: 12px; }
.check {
  width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center;
  background: var(--accent); color: var(--accent-ink); font-size: 2rem; font-weight: 700;
}
.done .review { width: 100%; text-align: left; }
.wa-btn {
  display: block; width: 100%; padding: 14px; border-radius: 12px; text-align: center;
  background: var(--accent); color: var(--accent-ink); font-weight: 700; text-decoration: none;
}

.wide { width: 100%; max-width: none; flex: none; }
.link-btn {
  background: none; border: 0; padding: 8px 0; color: var(--accent);
  font-weight: 600; text-align: center; text-decoration: underline; text-underline-offset: 3px;
}

/* Meus agendamentos */
.mine-list { display: grid; gap: 10px; }
.mine-card {
  display: grid; gap: 2px; padding: 12px 14px;
  background: var(--card); border: 1px solid var(--line); border-radius: 12px;
}
.mine-card strong { color: var(--accent); }

/* Rodapé de navegação */
.flash { margin: 0; padding: 0 16px; min-height: 0; color: var(--danger); font-size: .9rem; }
.flash:empty { display: none; }
.nav {
  position: sticky; bottom: 0; display: flex; justify-content: space-between; gap: 12px;
  padding: 12px 16px; padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
  background: var(--bg); border-top: 1px solid var(--line);
}
.ghost, .primary { padding: 12px 20px; border-radius: 10px; font-weight: 600; border: 1px solid var(--line); background: var(--card); }
.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); flex: 1; max-width: 260px; }
.primary:disabled { background: var(--card-2); border-color: var(--line); color: var(--muted); }
.ghost:disabled { opacity: .4; }

button:focus-visible, input:focus-visible, a:focus-visible, .svc:has(input:focus-visible) {
  outline: 2px solid var(--accent); outline-offset: 2px;
}

/* Painel do profissional aberto dentro da página */
.no-scroll { overflow: hidden; }
.overlay { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; background: var(--bg); }
.overlay[hidden] { display: none; }
.overlay-bar { flex: none; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.overlay-bar button { padding: 8px 14px; font-weight: 600; }
.overlay iframe { flex: 1; width: 100%; border: 0; background: var(--bg); }

.top, .progress, .stage, .flash, .nav { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.preview-note { margin: 0; padding: 6px 16px; border-bottom: 1px dashed var(--line); color: var(--muted); font-size: .72rem; text-align: center; }
</style>
</head>
<body>
<div class="app">
    <header class="top">
      <div class="avatar" id="avatar" aria-hidden="true">B</div>
      <div class="who">
        <strong id="shop-name">Barbearia</strong>
        <small>Agendamento online</small>
      </div>
      <a class="owner-link" id="owner-link" href="preview-admin.html">Painel do profissional</a>
    </header>
    <p class="preview-note">Pré-visualização com dados simulados no navegador. Na versão real, os horários vêm do PHP e do banco de dados.</p>

    <div id="progress" class="progress"></div>

    <main id="stage" class="stage" aria-live="polite"></main>

    <p id="flash" class="flash" role="alert"></p>

    <nav id="nav" class="nav">
      <button type="button" id="back" class="ghost" disabled>Voltar</button>
      <button type="button" id="next" class="primary" disabled>Próximo</button>
    </nav>
  </div>
<div id="owner-overlay" class="overlay" hidden role="dialog" aria-modal="true" aria-label="Painel do profissional">
    <div class="overlay-bar">
      <button type="button" id="owner-close" class="ghost">← Voltar ao agendamento</button>
    </div>
    <iframe id="owner-frame" name="owner-frame" title="Painel do profissional"></iframe>
  </div>
<script>
// API simulada no navegador: reproduz as regras de api/info, slots, book, my e cancel do PHP.
(function () {
  var cfg = {
    shop: "Barbearia Exemplo", open: "08:00", close: "18:00", step: 30, lunch: ["12:00", "13:00"],
    workDays: [1, 2, 3, 4, 5], ahead: 30, wa: "5522999999999",
    pros: [{ id: 1, name: "Rafael Costa" }, { id: 2, name: "Diego Martins" }],
    services: [
      { id: 1, name: "Disfarçado / Degradê", minutes: 45, price: 35 },
      { id: 2, name: "Cabelo e barba", minutes: 90, price: 65 },
      { id: 3, name: "Tesoura", minutes: 45, price: 35 },
      { id: 4, name: "Barba", minutes: 40, price: 30 },
      { id: 5, name: "Sobrancelha", minutes: 5, price: 5 },
      { id: 6, name: "Limpeza na cera quente", minutes: 20, price: 10 },
      { id: 7, name: "Pigmentação", minutes: 30, price: 20 },
      { id: 8, name: "Luzes", minutes: 120, price: 35 },
      { id: 9, name: "Limpeza de pele", minutes: 40, price: 30 },
      { id: 10, name: "Corte infantil", minutes: 45, price: 40 },
      { id: 11, name: "Corte + pigmentação", minutes: 60, price: 50 },
      { id: 12, name: "Hidratação", minutes: 30, price: 30 },
      { id: 13, name: "Platinado", minutes: 120, price: 100 },
      { id: 14, name: "Acabamento (pezinho)", minutes: 10, price: 10 },
      { id: 15, name: "Máquina 1 pente ou raspar cabeça", minutes: 30, price: 25 },
      { id: 16, name: "Relaxamento", minutes: 30, price: 30 },
      { id: 17, name: "Depilação nariz e orelha", minutes: 10, price: 20 },
      { id: 18, name: "Camuflagem pelos brancos", minutes: 20, price: 30 }
    ]
  };
  var LONG = { 1: "segunda-feira", 2: "terça-feira", 3: "quarta-feira", 4: "quinta-feira", 5: "sexta-feira", 6: "sábado", 7: "domingo" };
  var SHORT = { 1: "Seg", 2: "Ter", 3: "Qua", 4: "Qui", 5: "Sex", 6: "Sáb", 7: "Dom" };
  var pad = function (n) { return String(n).padStart(2, "0"); };
  var ymd = function (d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
  var dm = function (d) { return pad(d.getDate()) + "/" + pad(d.getMonth() + 1); };
  var dow = function (d) { return d.getDay() === 0 ? 7 : d.getDay(); };
  var toMin = function (t) { var p = t.split(":").map(Number); return p[0] * 60 + p[1]; };
  var toHm = function (m) { return pad(Math.floor(m / 60)) + ":" + pad(m % 60); };
  var nowMin = function () { var n = new Date(); return n.getHours() * 60 + n.getMinutes(); };

  var today = new Date(); today.setHours(0, 0, 0, 0);
  var limit = new Date(today); limit.setDate(limit.getDate() + cfg.ahead);

  function parseDate(s) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || "");
    if (!m) return null;
    var d = new Date(+m[1], +m[2] - 1, +m[3]);
    return ymd(d) === s ? d : null;
  }
  function bookable(d) { return cfg.workDays.indexOf(dow(d)) >= 0 && d >= today && d <= limit; }
  function pro(id) { return cfg.pros.filter(function (p) { return p.id === id; })[0] || null; }
  function pickServices(ids) {
    var out = [];
    for (var i = 0; i < ids.length; i++) {
      var s = cfg.services.filter(function (x) { return x.id === ids[i]; })[0];
      if (!s) return [];
      out.push(s);
    }
    return out;
  }
  function ids(raw) {
    if (typeof raw === "string") raw = raw ? raw.split(",") : [];
    var seen = {}, out = [];
    (raw || []).forEach(function (x) { x = parseInt(x, 10); if (x && !seen[x]) { seen[x] = 1; out.push(x); } });
    return out;
  }
  function normPhone(raw) {
    var d = String(raw || "").replace(/\D+/g, "");
    if (d.length === 10 || d.length === 11) return "55" + d;
    if ((d.length === 12 || d.length === 13) && d.indexOf("55") === 0) return d;
    return null;
  }
  function fmtPhone(p) {
    var d = p.indexOf("55") === 0 ? p.slice(2) : p;
    return d.length === 11 ? "(" + d.slice(0, 2) + ") " + d.slice(2, 7) + "-" + d.slice(7) : "(" + d.slice(0, 2) + ") " + d.slice(2, 6) + "-" + d.slice(6);
  }

  var bookings = [];
  var nextId = 1;
  function startsFor(date, pid, duration) {
    var open = toMin(cfg.open), close = toMin(cfg.close), ls = toMin(cfg.lunch[0]), le = toMin(cfg.lunch[1]);
    var busy = bookings.filter(function (b) { return b.pid === pid && b.date === date && b.status === "confirmed"; });
    var isToday = date === ymd(today), now = nowMin(), out = [];
    for (var t = open; t + duration <= close; t += cfg.step) {
      var end = t + duration;
      if (t < le && end > ls) continue;
      if (isToday && t <= now) continue;
      var clash = busy.some(function (b) { return t < b.end && end > b.start; });
      if (!clash) out.push(toHm(t));
    }
    return out;
  }
  function dates() {
    var out = [], minSvc = Math.min.apply(null, cfg.services.map(function (s) { return s.minutes; }));
    for (var i = 0; i <= cfg.ahead; i++) {
      var d = new Date(today); d.setDate(d.getDate() + i);
      if (cfg.workDays.indexOf(dow(d)) < 0) continue;
      if (i === 0 && nowMin() + minSvc > toMin(cfg.close)) continue;
      out.push({ date: ymd(d), short: i === 0 ? "Hoje" : SHORT[dow(d)], dm: dm(d), long: LONG[dow(d)] + ", " + dm(d) });
    }
    return out;
  }
  function addBooking(pid, date, time, minutes, name, phone, email, names, total) {
    var b = { id: nextId++, pid: pid, date: date, start: toMin(time), end: toMin(time) + minutes, name: name, phone: phone, email: email, services: names, total: total, status: "confirmed" };
    bookings.push(b);
    return b;
  }

  // Horários já ocupados para o bloqueio aparecer logo de início.
  (function seed() {
    var ds = dates().slice(0, 8);
    ds.forEach(function (d, i) {
      var first = i % 2, p = cfg.pros[first].id;
      var starts = startsFor(d.date, p, 45);
      if (starts[i % starts.length]) addBooking(p, d.date, starts[i % starts.length], 45, "Cliente", "5522900000000", "c@x.com", ["Corte masculino"], 40);
      var starts2 = startsFor(d.date, cfg.pros[1 - first].id, 75);
      if (starts2.length > 2) addBooking(cfg.pros[1 - first].id, d.date, starts2[2], 75, "Cliente", "5522900000000", "c@x.com", ["Corte + barba"], 65);
    });
  })();

  function reply(body, status) {
    return new Promise(function (resolve) {
      setTimeout(function () {
        resolve(new Response(JSON.stringify(body), { status: status || 200, headers: { "Content-Type": "application/json" } }));
      }, 120);
    });
  }
  function waLink(msg) { return "https://wa.me/" + cfg.wa + "?text=" + encodeURIComponent(msg); }

  var realFetch = window.fetch.bind(window);
  window.fetch = function (url, opts) {
    var u = String(url), q = new URLSearchParams(u.indexOf("?") >= 0 ? u.split("?")[1] : "");

    if (u.indexOf("api/info.php") === 0) {
      return reply({ shop_name: cfg.shop, professionals: cfg.pros, services: cfg.services, dates: dates() });
    }
    if (u.indexOf("api/slots.php") === 0) {
      var d = parseDate(q.get("date")), p = pro(parseInt(q.get("professional"), 10)), sv = pickServices(ids(q.get("services")));
      if (!d || !bookable(d)) return reply({ error: "Data indisponível para agendamento." }, 422);
      if (!p) return reply({ error: "Profissional inválido." }, 422);
      if (!sv.length) return reply({ error: "Escolha ao menos um serviço válido." }, 422);
      var dur = sv.reduce(function (a, s) { return a + s.minutes; }, 0);
      return reply({ times: startsFor(ymd(d), p.id, dur) });
    }
    if (u.indexOf("api/book.php") === 0) {
      var i = JSON.parse(opts && opts.body ? opts.body : "{}"), errors = {};
      var date = parseDate(i.date), pr = pro(parseInt(i.professional_id, 10)), svs = pickServices(ids(i.service_ids));
      var name = String(i.name || "").trim(), phone = normPhone(i.phone), email = String(i.email || "").trim();
      if (!date || !bookable(date)) errors.date = "Escolha um dia de atendimento dentro do período permitido.";
      if (!pr) errors.professional_id = "Profissional inválido.";
      if (!svs.length) errors.service_ids = "Escolha ao menos um serviço.";
      if (name.length < 3 || name.length > 80) errors.name = "Informe seu nome completo.";
      if (!phone) errors.phone = "Informe um telefone válido com DDD.";
      if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) errors.email = "Informe um e-mail válido.";
      if (Object.keys(errors).length) return reply({ error: "Verifique os dados informados.", fields: errors }, 422);
      var minutes = svs.reduce(function (a, s) { return a + s.minutes; }, 0);
      var total = svs.reduce(function (a, s) { return a + s.price; }, 0);
      if (startsFor(i.date, pr.id, minutes).indexOf(i.time) < 0) {
        return reply({ error: "Esse horário não está mais disponível. Escolha outro." }, 409);
      }
      var names = svs.map(function (s) { return s.name; });
      var b = addBooking(pr.id, i.date, i.time, minutes, name, phone, email, names, total);
      var parts = i.date.split("-");
      var msg = "✂️ *Novo agendamento - " + cfg.shop + "*\n\n👤 Cliente: " + name + "\n💈 Profissional: " + pr.name + "\n🧾 Serviços: " + names.join(" + ") +
        "\n📅 Data: " + parts[2] + "/" + parts[1] + "/" + parts[0] + "\n🕒 Horário: " + i.time + " (" + minutes + " min)\n💰 Total: R$ " + total.toFixed(2).replace(".", ",") +
        "\n📞 Telefone: " + fmtPhone(phone) + (email ? "\n✉️ E-mail: " + email : "");
      return reply({ ok: true, booking: { id: b.id }, whatsapp_sent: false, whatsapp_link: waLink(msg) }, 201);
    }
    if (u.indexOf("api/my.php") === 0) {
      var ph = normPhone(q.get("phone"));
      if (!ph) return reply({ error: "Telefone inválido." }, 422);
      var fold = function (s) { return String(s || "").trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").split(/\s+/)[0]; };
      var wanted = fold(q.get("name"));
      if (String(q.get("name") || "").trim().length < 3) return reply({ error: "Informe seu nome e WhatsApp." }, 422);
      var list = bookings.filter(function (b) {
        return b.phone === ph && fold(b.name) === wanted && b.status === "confirmed" && (b.date > ymd(today) || (b.date === ymd(today) && b.end > nowMin()));
      }).sort(function (a, b) { return a.date === b.date ? a.start - b.start : (a.date < b.date ? -1 : 1); }).map(function (b) {
        var d2 = parseDate(b.date);
        return { id: b.id, date: b.date, weekday: LONG[dow(d2)], dm: dm(d2), time: toHm(b.start), minutes: b.end - b.start, professional: pro(b.pid).name, services: b.services, total: b.total };
      });
      return reply({ bookings: list });
    }
    if (u.indexOf("api/cancel.php") === 0) {
      var c = JSON.parse(opts && opts.body ? opts.body : "{}");

<script>
"use strict";
// Agendamento em etapas. Compile com: npm run build  (gera public/app.js)
const MONTHS = [

function stepValid() {

function stepData() {
    stage.append(h("h2", {}, "Vamos começar! Como podemos te chamar?"), nameField(), phoneField(), field({
        id: "email", label: "Seu e-mail", optional: true, ph: "seu@email.com", type: "email", mode: "email", auto: "email",

}
/* ---------- Etapa 2: barbeiro ---------- */
function stepPro() {

/* ---------- Etapa 3: serviços ---------- */
function stepServices() {
    const total = h("p", { class: "svc-total" });

        const t = totals();

/* ---------- Etapa 4: data e horário ---------- */
let slotToken = 0;

    const avail = new Set(info.dates.map((d) => d.date));
    const months = [...new Set(info.dates.map((d) => d.date.slice(0, 7)))];

async function loadTimes(box) {

/* ---------- Painel do profissional dentro desta página ---------- */
function setupOwnerPanel() {
    const link = document.getElementById("owner-link");
    const overlay = document.getElementById("owner-overlay");
    const frame = document.getElementById("owner-frame");
    const closeBtn = document.getElementById("owner-close");
    if (!link || !overlay || !frame || !closeBtn)
        return;
    const url = link.href;
    const open = () => {
        const doc = window.OWNER_SRCDOC; // só nas prévias
        if (doc)
            frame.srcdoc = doc;
        else
            frame.src = url;
        overlay.hidden = false;
        document.body.classList.add("no-scroll");
        closeBtn.focus();
    };
    const close = () => {
        overlay.hidden = true;
        document.body.classList.remove("no-scroll");
        frame.removeAttribute("srcdoc");
        frame.src = "about:blank"; // ao reabrir, a sessão é conferida de novo
        link.focus();
    };
    link.addEventListener("click", (ev) => { ev.preventDefault(); open(); });
    closeBtn.addEventListener("click", close);
    document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && !overlay.hidden)
        close(); });
    window.addEventListener("message", (ev) => {
        const data = ev.data;
        if (ev.source === frame.contentWindow && data && data.type === "owner-exit")
            close();
    });
}
